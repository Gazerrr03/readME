<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Less is more: a load-bearing structural elevation">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5b6b7c" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- large faint index numeral -->
  <text x="1325" y="265" font-size="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        fill="#5b6b7c" fill-opacity="0.10" letter-spacing="6">01</text>

  <!-- non-load-bearing upper traces: the parts restraint removed -->
  <g stroke="#5b6b7c" stroke-opacity="0.12" stroke-width="1">
    <line x1="320"  y1="340" x2="320"  y2="520"/>
    <line x1="430"  y1="410" x2="430"  y2="520"/>
    <line x1="760"  y1="340" x2="760"  y2="520"/>
    <line x1="980"  y1="390" x2="980"  y2="520"/>
    <line x1="1200" y1="340" x2="1200" y2="520"/>
  </g>

  <!-- the row of columns: many faint, a few load-bearing -->
  <g stroke="#5b6b7c" stroke-opacity="0.18" stroke-width="1">
    <line x1="100"  y1="520" x2="100"  y2="740"/>
    <line x1="210"  y1="520" x2="210"  y2="740"/>
    <line x1="430"  y1="520" x2="430"  y2="740"/>
    <line x1="540"  y1="520" x2="540"  y2="740"/>
    <line x1="650"  y1="520" x2="650"  y2="740"/>
    <line x1="870"  y1="520" x2="870"  y2="740"/>
    <line x1="980"  y1="520" x2="980"  y2="740"/>
    <line x1="1090" y1="520" x2="1090" y2="740"/>
    <line x1="1310" y1="520" x2="1310" y2="740"/>
    <line x1="1420" y1="520" x2="1420" y2="740"/>
  </g>

  <!-- load-bearing columns -->
  <g stroke="#5b6b7c" stroke-width="3.5">
    <line x1="320"  y1="520" x2="320"  y2="740"/>
    <line x1="760"  y1="520" x2="760"  y2="740"/>
    <line x1="1200" y1="520" x2="1200" y2="740"/>
  </g>

  <!-- lintel and floor -->
  <line x1="100" y1="520" x2="1420" y2="520" stroke="#5b6b7c" stroke-width="4"/>
  <line x1="100" y1="740" x2="1420" y2="740" stroke="#5b6b7c" stroke-width="2"/>

  <!-- caption -->
  <text x="100" y="822" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        fill="#5b6b7c" letter-spacing="8" font-weight="600">LESS IS MORE</text>
  <text x="100" y="848" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        fill="#5b6b7c" fill-opacity="0.55" letter-spacing="4">WHEN TOKENS PRETEND TO WORK HARD</text>
</svg>
